name: Pre-production Docker

on:
  push:
    branches: [pre]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: muse2api-pre-production
  cancel-in-progress: false

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAMESPACE: btcfoxman
  IMAGE_NAME: muse2api
  DEPLOY_PATH: /home/btcfoxman/docker/muse2api
  DEPLOY_SERVICE: muse2api
  MUSE2API_HOSTNAME: muse2api.aiid.edu.kg
  MUSE2API_ORIGIN: http://127.0.0.1:18610
  MUSE2API_LAN_ORIGIN: http://192.168.3.5:18610
  CLOUDFLARED_CONFIG: /etc/cloudflared/config.yml

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      image_tag: ${{ github.sha }}
      digest: ${{ steps.publish.outputs.digest }}
      image_size: ${{ steps.publish.outputs.image_size }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build candidate on hosted runner
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: |
            ghcr.io/btcfoxman/muse2api:${{ github.sha }}
            ghcr.io/btcfoxman/muse2api:pre
          build-args: APP_GIT_SHA=${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
      - name: Verify candidate with isolated offline regressions
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --shm-size 2g \
            --mount "type=bind,source=$GITHUB_WORKSPACE/tests,target=/app/tests,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/scripts,target=/app/scripts,readonly" \
            --mount "type=bind,source=$(command -v node),target=/usr/local/bin/node,readonly" \
            -e EXPECTED_GIT_SHA="$GITHUB_SHA" \
            "ghcr.io/btcfoxman/muse2api:$GITHUB_SHA" python scripts/verify_image.py
          node --test tests/*.mjs
      - name: Publish the verified image
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          docker push "ghcr.io/btcfoxman/muse2api:$GITHUB_SHA"
          docker push ghcr.io/btcfoxman/muse2api:pre
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "ghcr.io/btcfoxman/muse2api:$GITHUB_SHA")"
          digest="${digest##*@}"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          image_size="$(docker image inspect --format '{{.Size}}' "ghcr.io/btcfoxman/muse2api:$GITHUB_SHA")"
          [[ "$image_size" =~ ^[1-9][0-9]*$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image_size=$image_size" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    runs-on: [self-hosted, linux, x64, muse2api-pre]
    timeout-minutes: 40
    env:
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
      IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
      IMAGE_SIZE: ${{ needs.build.outputs.image_size }}
    steps:
      - uses: actions/checkout@v4
      - name: Isolate registry authentication
        run: |
          registry_dir="$RUNNER_TEMP/muse2api-docker-auth-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$registry_dir"
          chmod 700 "$registry_dir"
          echo "DOCKER_CONFIG=$registry_dir" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and deploy persisted service
        run: bash scripts/deploy_pre.sh
      - name: Configure existing Cloudflared ingress
        run: bash scripts/cloudflared_pre.sh
      - name: Verify public health and authentication
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 10 "https://${MUSE2API_HOSTNAME}/healthz" >/dev/null; then
              status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "https://${MUSE2API_HOSTNAME}/v1/models")"
              admin_status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "https://${MUSE2API_HOSTNAME}/admin")"
              account_status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "https://${MUSE2API_HOSTNAME}/admin/accounts")"
              if [ "$status" = 401 ] && [[ "$admin_status" =~ ^30[237]$ ]] && [ "$account_status" = 401 ]; then
                curl -fsS --max-time 10 "${MUSE2API_LAN_ORIGIN}/healthz" >/dev/null
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'Public service health/authentication check failed' >&2
          exit 1
