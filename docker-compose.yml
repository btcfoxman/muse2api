services:
  muse2api:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-btcfoxman}/${IMAGE_NAME:-muse2api}:${IMAGE_TAG:-pre}
    container_name: muse2api
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:18610:18610"
    environment:
      TZ: Asia/Taipei
      MUSE2API_HOME: /app
      MUSE2API_HOST: 0.0.0.0
      MUSE2API_PORT: "18610"
      MUSE2API_CHROMIUM: /usr/bin/chromium
      MUSE2API_PROFILE_ROOT: /app/data/chrome-profiles
      MUSE2API_MANAGED_DEPLOYMENT: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ./.env
        target: /app/.env
        bind:
          create_host_path: false
      - type: bind
        source: ./data
        target: /app/data
        bind:
          create_host_path: false
    shm_size: 2gb
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18610/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - my-shared-net

networks:
  my-shared-net:
    external: true
