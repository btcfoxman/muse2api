<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="same-origin">
<title>登录管理台 · muse2api</title>
<style>
  :root{color-scheme:dark;--bg:#0a0e17;--panel:#121a2b;--line:#2b3550;--text:#e7eaf3;--muted:#8590a8;--accent:#4f8cff;--bad:#f87171}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;min-height:100dvh;background:radial-gradient(900px 600px at 12% -10%,#152140 0%,var(--bg) 65%) no-repeat,var(--bg);color:var(--text);font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;display:flex;flex-direction:column}
  header{padding:28px 36px;display:flex;align-items:center;gap:10px;font-size:17px;font-weight:650;letter-spacing:.2px}
  .mark{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 18px rgba(79,140,255,.7)}
  header span:last-child{color:var(--muted);font-size:12px;font-weight:400;margin-left:3px}
  main{flex:1;display:grid;place-items:center;padding:36px 22px 90px}
  .login-card{width:100%;max-width:424px;background:linear-gradient(180deg,#121a2b 0%,#0f1626 100%);border:1px solid #25314a;border-radius:16px;padding:36px;box-shadow:0 24px 80px rgba(0,0,0,.24)}
  .eyebrow{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px;letter-spacing:1.5px;margin:0 0 18px}
  .eyebrow svg{color:var(--accent)}
  h1{margin:0 0 9px;font-size:25px;line-height:1.3;font-weight:650;letter-spacing:-.4px}
  .intro{color:var(--muted);margin:0 0 28px;font-size:13px}
  label{display:block;margin-bottom:8px;font-size:12.5px;color:#bac4d8}
  .password-field{display:flex;align-items:center;background:#0a1120;border:1px solid var(--line);border-radius:9px;transition:border-color .15s,box-shadow .15s}
  .password-field:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,140,255,.13)}
  input{min-width:0;width:100%;font:inherit;font-size:16px;padding:12px 14px;background:transparent;border:0;color:var(--text);outline:none;border-radius:9px}
  input::placeholder{color:#58657e;font-size:13px}
  button{font:inherit;cursor:pointer;transition:background .15s,color .15s,opacity .15s}
  button:focus-visible{outline:2px solid #9cc0ff;outline-offset:4px}
  .reveal{flex:0 0 auto;padding:8px 12px;border:0;background:transparent;color:var(--muted);font-size:12px;border-radius:6px;margin-right:3px}
  .reveal:hover{color:var(--text);background:rgba(255,255,255,.04)}
  .submit{display:block;width:100%;margin-top:18px;padding:11px 18px;border:1px solid #4f8cff;border-radius:9px;background:#2563eb;color:#fff;font-weight:600;font-size:13.5px;min-height:44px}
  .submit:hover{background:#3578f2}
  button:disabled{opacity:.55;cursor:wait}
  .error{margin:14px 0 0;color:var(--bad);font-size:12.5px;min-height:20px;overflow-wrap:anywhere}
  .footnote{padding-top:22px;margin:24px 0 0;border-top:1px solid #20293d;color:var(--muted);font-size:11.5px}
  footer{text-align:center;color:#58657e;font-size:11px;padding:0 22px 22px;letter-spacing:.4px}
  @media(max-width:480px){header{padding:24px}.login-card{padding:28px 24px}main{padding:18px 20px 60px}h1{font-size:23px}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><span class="mark" aria-hidden="true"></span>muse2api <span>管理控制台</span></header>
<main>
  <section class="login-card" aria-labelledby="login-title">
    <p class="eyebrow"><svg width="14" height="16" viewBox="0 0 14 16" fill="none" aria-hidden="true"><path d="M3.5 6V4.5a3.5 3.5 0 0 1 7 0V6M2 6h10v8H2z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M7 9v2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>ADMIN ACCESS</p>
    <h1 id="login-title">登录管理台</h1>
    <p class="intro">输入管理密码，继续管理账号和任务。</p>
    <form id="loginForm" method="post" action="/admin/login">
      <label for="password">管理密码</label>
      <div class="password-field">
        <input id="password" type="password" name="password" placeholder="请输入管理密码" autocomplete="current-password" maxlength="512" required autofocus aria-describedby="loginError">
        <button type="button" class="reveal" id="revealPassword" aria-label="显示密码" aria-pressed="false">显示</button>
      </div>
      <button type="submit" class="submit" id="loginButton">登录</button>
      <p class="error" id="loginError" role="alert" aria-live="polite"></p>
    </form>
    <p class="footnote">仅授权管理员可访问此控制台。</p>
  </section>
</main>
<footer>MUSE2API · 管理控制台</footer>
<script>
const form = document.getElementById('loginForm');
const passwordInput = document.getElementById('password');
const loginButton = document.getElementById('loginButton');
const loginError = document.getElementById('loginError');
const revealPassword = document.getElementById('revealPassword');
let submitting = false;

revealPassword.addEventListener('click', () => {
  const show = passwordInput.type === 'password';
  passwordInput.type = show ? 'text' : 'password';
  revealPassword.textContent = show ? '隐藏' : '显示';
  revealPassword.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
  revealPassword.setAttribute('aria-pressed', String(show));
  passwordInput.focus();
});

async function submitLogin(event){
  event.preventDefault();
  if (submitting) return;
  if (!passwordInput.value) {
    loginError.textContent = '请输入管理密码。';
    passwordInput.focus();
    return;
  }
  submitting = true;
  passwordInput.disabled = true;
  loginButton.disabled = true;
  revealPassword.disabled = true;
  loginButton.textContent = '登录中…';
  form.setAttribute('aria-busy', 'true');
  loginError.textContent = '';
  try{
    const response = await fetch('/admin/login', {
      method: 'POST', credentials: 'same-origin',
      headers: {'Content-Type': 'application/json', 'Accept': 'application/json'},
      body: JSON.stringify({password: passwordInput.value})
    });
    if (!response.ok) {
      loginError.textContent = response.status === 401 ? '管理密码不正确，请重试。'
        : response.status === 429 ? '尝试次数过多，请稍后再试。'
        : response.status === 503 ? '管理登录暂不可用，请联系管理员。'
        : '登录失败，请稍后重试。';
      return;
    }
    const result = await response.json();
    if (result.ok !== true) {
      loginError.textContent = '登录未完成，请重试。';
      return;
    }
    location.replace('/admin');
  }catch(e){
    loginError.textContent = '连接失败，请检查网络后重试。';
  }finally{
    passwordInput.value = '';
    passwordInput.type = 'password';
    revealPassword.textContent = '显示';
    revealPassword.setAttribute('aria-label', '显示密码');
    revealPassword.setAttribute('aria-pressed', 'false');
    submitting = false;
    passwordInput.disabled = false;
    loginButton.disabled = false;
    revealPassword.disabled = false;
    loginButton.textContent = '登录';
    form.removeAttribute('aria-busy');
    if (loginError.textContent) passwordInput.focus();
  }
}
form.addEventListener('submit', submitLogin);
</script>
</body>
</html>
